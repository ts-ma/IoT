ure></div><h2 id="training">training</h2><div class="grid"><figure><a href="figures/training/learning_curves_har_jan.png" target="_blank"><img loading="lazy" src="figures/training/learning_curves_har_jan.png" alt=""></a><figcaption><b>Learning curves (har, Jan2026 only)</b><br>Training and held-out-fold loss/accuracy per epoch, mean ± sd over the 10 official folds. The test fold was only monitored, never used to stop or tune training (fixed epochs, as in Lab 3).<br><code>figures/training/learning_curves_har_jan.png</code> · <a href="figures/training/learning_curves_har_jan.pdf">PDF</a></figcaption></figure><figure><a href="figures/training/learning_curves_har_jan_real.png" target="_blank"><img loading="lazy" src="figures/training/learning_curves_har_jan_real.png" alt=""></a><figcaption><b>Learning curves (har, Jan2026 + group recordings)</b><br>Training and held-out-fold loss/accuracy per epoch, mean ± sd over the 10 official folds. The test fold was only monitored, never used to stop or tune training (fixed epochs, as in Lab 3).<br><code>figures/training/learning_curves_har_jan_real.png</code> · <a href="figures/training/learning_curves_har_jan_real.pdf">PDF</a></figcaption></figure><figure><a href="figures/training/learning_curves_all_models_har.png" target="_blank"><img loading="lazy" src="figures/training/learning_curves_all_models_har.png" alt=""></a><figcaption><b>Held-out score per epoch, every architecture (har, Jan2026 only)</b><br>Mean held-out score (static/dynamic mean for HAR, balanced accuracy for social) over the 10 folds after each epoch.<br><code>figures/training/learning_curves_all_models_har.png</code> · <a href="figures/training/learning_curves_all_models_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/training/learning_curves_social_jan.png" target="_blank"><img loading="lazy" src="figures/training/learning_curves_social_jan.png" alt=""></a><figcaption><b>Learning curves (social, Jan2026 only)</b><br>Training and held-out-fold loss/accuracy per epoch, mean ± sd over the 10 official folds. The test fold was only monitored, never used to stop or tune training (fixed epochs, as in Lab 3).<br><code>figures/training/learning_curves_social_jan.png</code> · <a href="figures/training/learning_curves_social_jan.pdf">PDF</a></figcaption></figure><figure><a href="figures/training/learning_curves_social_jan_real.png" target="_blank"><img loading="lazy" src="figures/training/learning_curves_social_jan_real.png" alt=""></a><figcaption><b>Learning curves (social, Jan2026 + group recordings)</b><br>Training and held-out-fold loss/accuracy per epoch, mean ± sd over the 10 official folds. The test fold was only monitored, never used to stop or tune training (fixed epochs, as in Lab 3).<br><code>figures/training/learning_curves_social_jan_real.png</code> · <a href="figures/training/learning_curves_social_jan_real.pdf">PDF</a></figcaption></figure><figure><a href="figures/training/learning_curves_all_models_social.png" target="_blank"><img loading="lazy" src="figures/training/learning_curves_all_models_social.png" alt=""></a><figcaption><b>Held-out score per epoch, every architecture (social, Jan2026 only)</b><br>Mean held-out score (static/dynamic mean for HAR, balanced accuracy for social) over the 10 folds after each epoch.<br><code>figures/training/learning_curves_all_models_social.png</code> · <a href="figures/training/learning_curves_all_models_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/training/training_time.png" target="_blank"><img loading="lazy" src="figures/training/training_time.png" alt=""></a><figcaption><b>Training cost per fold</b><br>Wall-clock time per fold job on an Apple M1 Pro (2 threads per job, 4 jobs in parallel).<br><code>figures/training/training_time.png</code> · <a href="figures/training/training_time.pdf">PDF</a></figcaption></figure></div><h2 id="results">results</h2><div class="grid"><figure><a href="figures/results/per_class_har.png" target="_blank"><img lo ence. On the diagonal = confidence can be trusted (e.g. for showing a confidence value in the app).<br><code>figures/results/calibration.png</code> · <a href="figures/results/calibration.pdf">PDF</a></figcaption></figure><figure><a href="figures/results/roc_pr_har.png" target="_blank"><img loading="lazy" src="figures/results/roc_pr_har.png" alt=""></a><figcaption><b>ROC and PR curves (har)</b><br>Per-class ROC (with AUC) and precision–recall curves of the headline models, all test windows pooled.<br><code>figures/results/roc_pr_har.png</code> · <a href="figures/results/roc_pr_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/results/roc_pr_social.png" target="_blank"><img loading="lazy" src="figures/results/roc_pr_social.png" alt=""></a><figcaption><b>ROC and PR curves (social)</b><br>Per-class ROC (with AUC) and precision–recall curves of the headline models, all test windows pooled.<br><code>figures/results/roc_pr_social.png</code> · <a href="figures/results/roc_pr_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/results/tsne_har.png" target="_blank"><img loading="lazy" src="figures/results/tsne_har.png" alt=""></a><figcaption><b>t-SNE embedding (har)</b><br>Penultimate-layer activations of held-out windows, projected to 2-D. Overlapping clusters are the classes the model confuses.<br><code>figures/results/tsne_har.png</code> · <a href="figures/results/tsne_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/results/tsne_social.png" target="_blank"><img loading="lazy" src="figures/results/tsne_social.png" alt=""></a><figcaption><b>t-SNE embedding (social)</b><br>Penultimate-layer activations of held-out windows, projected to 2-D. Overlapping clusters are the classes the model confuses.<br><code>figures/results/tsne_social.png</code> · <a href="figures/results/tsne_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/results/variant_paired.png" target="_blank"><img loading="lazy" src="figures/results/variant_paired.png" alt=""></a><figcaption><b>Effect of adding the group&#x27;s recordings</b><br>Each line is one fold: score with Jan2026 training data only vs with the group members&#x27; recordings added (same fold, seed 0).<br><code>figures/results/variant_paired.png</code> · <a href="figures/results/variant_paired.pdf">PDF</a></figcaption></figure></div><h2 id="comparison">comparison</h2><div class="grid"><figure><a href="figures/comparison/architectures_har.png" target="_blank"><img loading="lazy" src="figures/comparison/architectures_har.png" alt=""></a><figcaption><b>Architecture comparison (har)</b><br>Every architecture trained and tested on the same official folds with the same data. ★ = deployed model. Error bars = sd over folds.<br><code>figures/comparison/architectures_har.png</code> · <a href="figures/comparison/architectures_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/architectures_per_class_har.png" target="_blank"><img loading="lazy" src="figures/comparison/architectures_per_class_har.png" alt=""></a><figcaption><b>Per-class recall of every architecture (har)</b><br>Which classes each architecture gets right; the weak classes are shared by all models, i.e. they are hard in the data, not only for one model.<br><code>figures/comparison/architectures_per_class_har.png</code> · <a href="figures/comparison/architectures_per_class_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/accuracy_vs_cost_har.png" target="_blank"><img loading="lazy" src="figures/comparison/accuracy_vs_cost_har.png" alt=""></a><figcaption><b>Accuracy vs model cost (har)</b><br>Trade-off between accuracy and TFLite size / single-window latency on this Mac (a phone is slower, but the ranking holds).<br><code>figures/comparison/accuracy_vs_cost_har.png</code> · <a href="figures/comparison/accuracy_vs_cost_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/architectures_social.png" target="_blank"><img loading="lazy" src="figures/comparison/architectures_social.png" alt=""></a><figcaption><b>Architecture comparison (social)</b><br>Every architecture trained and tested on the same official folds with the same data. ★ = deployed model. Error bars = sd over folds.<br><code>figures/comparison/architectures_social.png</code> · <a href="figures/comparison/architectures_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/architectures_per_class_social.png" target="_blank"><img loading="lazy" src="figures/comparison/architectures_per_class_social.png" alt=""></a><figcaption><b>Per-class recall of every architecture (social)</b><br>Which classes each architecture gets right; the weak classes are shared by all models, i.e. they are hard in the data, not only for one model.<br><code>figures/comparison/architectures_per_class_social.png</code> · <a href="figures/comparison/architectures_per_class_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/accuracy_vs_cost_social.png" target="_blank"><img loading="lazy" src="figures/comparison/accuracy_vs_cost_social.png" alt=""></a><figcaption><b>Accuracy vs model cost (social)</b><br>Trade-off between accuracy and TFLite size / single-window latency on this Mac (a phone is slower, but the ranking holds).<br><code>figures/comparison/accuracy_vs_cost_social.png</code> · <a href="figures/comparison/accuracy_vs_cost_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/class_weight_sweep.png" target="_blank"><img loading="lazy" src="figures/comparison/class_weight_sweep.png" alt=""></a><figcaption><b>Class-weight sweep (social)</b><br>Each class&#x27;s marked recall as the class weights move from none (0) to fully balanced (1). The grey band is the chosen setting.<br><code>figures/comparison/class_weight_sweep.png</code> · <a href="figures/comparison/class_weight_sweep.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/paired_tests.png" target="_blank"><img load
