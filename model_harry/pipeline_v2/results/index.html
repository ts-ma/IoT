 href="figures/data/example_signals_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/data/example_signals_social.png" target="_blank"><img loading="lazy" src="figures/data/example_signals_social.png" alt=""></a><figcaption><b>Example raw signals (social)</b><br>First 20 s of one recording per class (x, y, z in g). Posture shows up as the constant offset (gravity), activity as the oscillation around it.<br><code>figures/data/example_signals_social.png</code> · <a href="figures/data/example_signals_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/data/gravity_orientation.png" target="_blank"><img loading="lazy" src="figures/data/gravity_orientation.png" alt=""></a><figcaption><b>Gravity orientation per posture</b><br>Mean acceleration of each static recording (= gravity direction = posture). Group members&#x27; recordings (large markers) fall inside the Jan2026 clusters, so sensor placement matches the dataset.<br><code>figures/data/gravity_orientation.png</code> · <a href="figures/data/gravity_orientation.pdf">PDF</a></figcaption></figure><figure><a href="figures/data/real_data_quality.png" target="_blank"><img loading="lazy" src="figures/data/real_data_quality.png" alt=""></a><figcaption><b>Group recordings: quality checks</b><br>Per recording of each group member: angle between its gravity vector and the Jan2026 mean for the same class (placement check) and the sampling rate estimated from timestamps (nominal 12.5 Hz).<br><code>figures/data/real_data_quality.png</code> · <a href="figures/data/real_data_quality.pdf">PDF</a></figcaption></figure><figure><a href="figures/data/spectra_har.png" target="_blank"><img loading="lazy" src="figures/data/spectra_har.png" alt=""></a><figcaption><b>Mean spectrum of the acceleration magnitude (har)</b><br>Welch power spectrum of the gravity-free acceleration magnitude, averaged over up to 200 recordings per class. These frequency bands motivate the in-model band-power features.<br><code>figures/data/spectra_har.png</code> · <a href="figures/data/spectra_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/data/intensity_har.png" target="_blank"><img loading="lazy" src="figures/data/intensity_har.png" alt=""></a><figcaption><b>Movement intensity per class (har)</b><br>How much the signal varies around gravity in each class (log scale). Static and social classes differ by orders of magnitude from dynamic ones.<br><code>figures/data/intensity_har.png</code> · <a href="figures/data/intensity_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/data/spectra_social.png" target="_blank"><img loading="lazy" src="figures/data/spectra_social.png" alt=""></a><figcaption><b>Mean spectrum of the acceleration magnitude (social)</b><br>Welch power spectrum of the gravity-free acceleration magnitude, averaged over up to 200 recordings per class. These frequency bands motivate the in-model band-power features.<br><code>figures/data/spectra_social.png</code> · <a href="figures/data/spectra_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/data/intensity_social.png" target="_blank"><img loading="lazy" src="figures/data/intensity_social.png" alt=""></a><figcaption><b>Movement intensity per class (social)</b><br>How much the signal varies around gravity in each class (log scale). Static and social classes differ by orders of magnitude from dynamic ones.<br><code>figures/data/intensity_social.png</code> · <a href="figures/data/intensity_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/data/duplicates.png" target="_blank"><img loading="lazy" src="figures/data/duplicates.png" alt=""></a><figcaption><b>Static HAR recordings that are byte-copies of social recordings</b><br>Every static daily-activity file is a copy of a social-signal recording (breathing). The two official fold CSVs mostly place the copies in different folds.<br><code>figures/data/duplicates.png</code> · <a href="figures/data/duplicates.pdf">PDF</a></figcaption></figure></div><h2 id="training">training</h2><div class="grid"><figure><a href="figures/training/learning_curves_har_all.png" target="_blank"><img loading="lazy" src="figures/training/learning_curves_har_all.png" alt=""></a><figcaption><b>Learning curves (har, all test windows (Jan2026 + group))</b><br>Training and held-out-fold loss/accuracy per epoch, mean ± sd over the 10 official folds. The test fold was only monitored, never used to stop or tune training (fixed epochs, as in Lab 3).<br><code>figures/training/learning_curves_har_all.png</code> · <a href="figures/training/learning_curves_har_all.pdf">PDF</a></figcaption></figure><figure><a href="figures/training/learning_curves_all_models_har.png" target="_blank"><img loading="lazy" src="figures/training/learning_curves_all_models_har.png" alt=""></a><figcaption><b>Held-out score per epoch, every architecture (har)</b><br>Mean held-out score (static/dynamic mean for HAR, balanced accuracy for social) over the 10 folds after each epoch.<br><code>figures/training/learning_curves_all_models_har.png</code> · <a href="figures/training/learning_curves_all_models_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/training/learning_curves_social_all.png" target="_blank"><img loading="lazy" src="figures/training/learning_curves_social_all.png" alt=""></a><figcaption><b>Learning curves (social, all test windows (Jan2026 + group))</b><br>Training and held-out-fold loss/accuracy per epoch, mean ± sd over the 10 official folds. The test fold was only monitored, never used to stop or tune training (fixed epochs, as in Lab 3).<br><code>figures/training/learning_curves_social_all.png</code> · <a href="figures/training/learning_curves_social_all.pdf">PDF</a></figcaption></figure><figure><a href="figures/training/learning_curves_all_models_social.png" target="_blank"><img loading="lazy" src="figures/training/learning_curves_all_models_social.png" alt=""></a><figcaption><b>Held-out score per epoch, every architecture (social)</b><br>Mean held-out score (static/dynamic mean for HAR, balanced accuracy for social) over the 10 folds after each epoch.<br><code>figures/training/learning_curves_all_models_social.png</code> · <a href="figures/training/learning_curves_all_models_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/training/training_time.png" target="_blank"><img loading="lazy" src="figures/training/training_time.png" alt=""></a><figcaption><b>Training cost per fold</b><br>Wall-clock time per fold job on an Apple M1 Pro (2 threads per job, 4 jobs in parallel).<br><code>figures/training/training_time.png</code> · <a href="figures/training/training_time.pdf">PDF</a></figcaption></figure></div><h2 id="results">results</h2><div class="grid"><figure><a href="figures/results/per_class_har.png" target="_blank"><img loading="lazy" src="figures/results/per_class_har.png" alt=""></a><figcaption><b>Per-class accuracy, official 10-fold CV (har)</b><br>Mean over the 10 official folds of each class&#x27;s recall (the marked number), error bars = sd over folds. Blue: every test window of each fold (datasetJan2026 + the group member in that fold); grey: the datasetJan2026 windows only, i.e. what the CW3 marking computes.<br><code>figures/results/per_class_har.png</code> · <a href="figures/results/per_class_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/results/group_scores_har.png" target="_blank"><img loading="lazy" src="figures/results/group_scores_har.png" alt=""></a><figcaption><b>Group scores (har)</b><br>Marked group scores (mean over folds and seeds); error bars = sd over folds.<br><code>figures/results/group_scores_har.png</code> · <a href="figures/results/group_scores_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/results/fold_heatmap_har_all.png" target="_blank"><img loading="lazy" src="figures/results/fold_heatmap_har_all.png" alt=""></a><figcaption><b>Recall per class and fold (har, all test windows (Jan2026 + group), seed 0)</b><br>Ever es of the headline models, all test windows pooled.<br><code>figures/results/roc_pr_social.png</code> · <a href="figures/results/roc_pr_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/results/tsne_har.png" target="_blank"><img loading="lazy" src="figures/results/tsne_har.png" alt=""></a><figcaption><b>t-SNE embedding (har)</b><br>Penultimate-layer activations of held-out windows, projected to 2-D. Overlapping clusters are the classes the model confuses.<br><code>figures/results/tsne_har.png</code> · <a href="figures/results/tsne_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/results/tsne_social.png" target="_blank"><img loading="lazy" src="figures/results/tsne_social.png" alt=""></a><figcaption><b>t-SNE embedding (social)</b><br>Penultimate-layer activations of held-out windows, projected to 2-D. Overlapping clusters are the classes the model confuses.<br><code>figures/results/tsne_social.png</code> · <a href="figures/results/tsne_social.pdf">PDF</a></figcaption></figure></div><h2 id="comparison">comparison</h2><div class="grid"><figure><a href="figures/comparison/architectures_har.png" target="_blank"><img loading="lazy" src="figures/comparison/architectures_har.png" alt=""></a><figcaption><b>Architecture comparison (har)</b><br>Each of our four architectures trained and tested on the same folds with the same data. ★ = deployed model. Error bars = sd over folds.<br><code>figures/comparison/architectures_har.png</code> · <a href="figures/comparison/architectures_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/architectures_per_class_har.png" target="_blank"><img loading="lazy" src="figures/comparison/architectures_per_class_har.png" alt=""></a><figcaption><b>Per-class recall of every architecture (har)</b><br>Which classes each architecture gets right; the weak classes are shared by all models, i.e. they are hard in the data, not only for one model.<br><code>figures/comparison/architectures_per_class_har.png</code> · <a href="figures/comparison/architectures_per_class_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/accuracy_vs_cost_har.png" target="_blank"><img loading="lazy" src="figures/comparison/accuracy_vs_cost_har.png" alt=""></a><figcaption><b>Accuracy vs model cost (har)</b><br>Trade-off between accuracy and TFLite size / single-window latency on this Mac (a phone is slower, but the ranking holds).<br><code>figures/comparison/accuracy_vs_cost_har.png</code> · <a href="figures/comparison/accuracy_vs_cost_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/architectures_social.png" target="_blank"><img loading="lazy" src="figures/comparison/architectures_social.png" alt=""></a><figcaption><b>Architecture comparison (social)</b><br>Each of our four architectures trained and tested on the same folds with the same data. ★ = deployed model. Error bars = sd over folds.<br><code>figures/comparison/architectures_social.png</code> · <a href="figures/comparison/architectures_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/architectures_per_class_social.png" target="_blank"><img loading="lazy" src="figures/comparison/architectures_per_class_social.png" alt=""></a><figcaption><b>Per-class recall of every architecture (social)</b><br>Which classes each architecture gets right; the weak classes are shared by all models, i.e. they are hard in the data, not only for one model.<br><code>figures/comparison/architectures_per_class_social.png</code> · <a href="figures/comparison/architectures_per_class_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/accuracy_vs_cost_social.png" target="_blank"><img loading="lazy" src="figures/comparison/accuracy_vs_cost_social.png" alt=""></a><figcaption><b>Accuracy vs model cost (social)</b><br>Trade-off between accuracy and TFLite size / single-window latency on this Mac (a phone is slower, but the ranking holds).<br><code>figures/comparison/accuracy_vs_cost_social.png</code> · <a href="figures/comparison/accuracy_vs_cost_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/class_weight_sweep.png" target="_blank"><img loading="lazy" src="figures/comparison/class_weight_sweep.png" alt=""></a><figcaption><b>Class-weight sweep (social)</b><br>Each class&#x27;s marked recall as the class weights move from none (0) to fully balanced (1). The grey band is the chosen setting.<br><code>figures/comparison/class_weight_sweep.png</code> · <a href="figures/comparison/class_weight_sweep.pdf">PDF</a></figcaption></figure><figure><a href="figures/comparison/paired_tests.png" target="_blank"><img loading="lazy" src="figures/comparison/paired_tests.png" alt=""></a><figcaption><b>Paired statistical comparisons</b><br>Differences between models / settings on the same folds with Wilcoxon signed-rank p-values (10 folds = small sample, so p ≥ 0.002 is the smallest possible).<br><code>figures/comparison/paired_tests.png</code> · <a href="figures/comparison/paired_tests.pdf">PDF</a></figcaption></figure></div><h2 id="deploy">deploy</h2><div class="grid"><figure><a href="figures/deploy/model_size.png" target="_blank"><img loading="lazy" src="figures/deploy/model_size.png" alt=""></a><figcaption><b>TFLite size (KB)</b><br>Deployment cost of each of our architectures (blue = HAR, orange = social).<br><code>figures/deploy/model_size.png</code> · <a href="figures/deploy/model_size.pdf">PDF</a></figcaption></figure><figure><a href="figures/deploy/inference_time.png" target="_blank"><img loading="lazy" src="figures/deploy/inference_time.png" alt=""></a><figcaption><b>ms per window (1 thread, Mac)</b><br>Deployment cost of each of our architectures (blue = HAR, orange = social).<br><code>figures/deploy/inference_time.png</code> · <a href="figures/deploy/inference_time.pdf">PDF</a></figcaption></figure><figure><a href="figures/deploy/parameters.png" target="_blank"><img loading="lazy" src="figures/deploy/parameters.png" alt=""></a><figcaption><b>parameters</b><br>Deployment cost of each of our architectures (blue = HAR, orange = social).<br><code>figures/deploy/parameters.png</code> · <a href="figures/deploy/parameters.pdf">PDF</a></figcaption></figure></div><h2 id="real">real</h2><div class="grid"><figure><a href="figures/real/person_har.png" target="_blank"><img loading="lazy" src="figures/real/person_har.png" alt=""></a><figcaption><b>Group members as unseen subjects (har)</b><br>Each member&#x27;s recordings are the test set of one fold, so these models never saw that person (the other member and the other 9 Jan2026 folds were in training). Mean over the 3 seeds.<br><code>figures/real/person_har.png</code> · <a href="figures/real/person_har.pdf">PDF</a></figcaption></figure><figure><a href="figures/real/person_social.png" target="_blank"><img loading="lazy" src="figures/real/person_social.png" alt=""></a><figcaption><b>Group members as unseen subjects (social)</b><br>Each member&#x27;s recordings are the test set of one fold, so these models never saw that person (the other member and the other 9 Jan2026 folds were in training). Mean over the 3 seeds.<br><code>figures/real/person_social.png</code> · <a href="figures/real/person_social.pdf">PDF</a></figcaption></figure><figure><a href="figures/real/person_social_postures.png" target="_blank"><img loading="lazy" src="figures/real/person_social_postures.png" alt=""></a><figcaption><b>Social accuracy by posture (group members)</b><br>Sitting/standing vs lying, on the fold where each member is the unseen test subject (seed 0).<br><code>figures/real/person_social_postures.png</code> · <a href="figures/real/person_social_postures.pdf">PDF</a></figcaption></figure><figure><a href="figures/real/social_window_choice.png" target="_blank"><img loading="lazy" src="figures/real/social_window_choice.png" alt=""></a><figcaption><b>Choosing the social window</b><br>Candidates: 4/5/6/8 s windows and an 8 s model trained to answer from
